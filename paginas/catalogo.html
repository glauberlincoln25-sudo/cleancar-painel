<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Clean Car</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../estilo.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="flex">
    <!-- Barra Lateral (mesma do sistema) -->
    <aside class="w-60 bg-white min-h-screen shadow-sm border-r border-slate-100 p-4">
      <div class="flex items-center gap-2 mb-8 mt-2">
        <span class="text-2xl">🚗</span>
        <h1 class="font-bold text-lg text-primary">Clean Car</h1>
      </div>
      <nav class="space-y-1">
        <a href="../index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">
          <i class="fa fa-tachometer-alt w-5 text-center"></i> Painel
        </a>
        <a href="campanha.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">
          <i class="fa fa-bullhorn w-5 text-center"></i> Campanha
        </a>
        <a href="criar.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">
          <i class="fa fa-plus-circle w-5 text-center"></i> Criar Postagem
        </a>
        <a href="catalogo.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-primary/5 text-primary font-medium">
          <i class="fa fa-book w-5 text-center"></i> Catálogo
        </a>
        <a href="dola.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">
          <i class="fa fa-robot w-5 text-center"></i> Dola IA
        </a>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6">
      <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-2xl font-bold text-slate-800">📖 Catálogo de Serviços</h2>
            <p class="text-slate-500 text-sm">Gerencie todos os serviços — a IA lê daqui automaticamente</p>
          </div>
          <button id="btnNovoServico" class="bg-primary text-white px-4 py-2 rounded-lg text-sm">
            <i class="fa fa-plus"></i> Novo Serviço
          </button>
        </div>

        <!-- Sugestões da IA -->
        <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6">
          <h3 class="font-semibold text-green-800 mb-3">🧠 Sugestões de Campanha da Dola</h3>
          <div id="sugestoesIA" class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <!-- Carregado via JS -->
          </div>
        </div>

        <!-- Lista de Serviços -->
        <div id="listaServicos" class="space-y-3">
          <!-- Carregado dinamicamente -->
        </div>

        <!-- Modal Editar/Adicionar -->
        <div id="modalServico" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
          <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <h3 id="tituloModal" class="font-bold text-lg mb-4">Editar Serviço</h3>
            <form id="formServico" class="space-y-3">
              <input type="hidden" id="servicoId">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
                <input type="text" id="servicoNome" class="w-full px-3 py-2 border rounded-lg" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="servicoValor" class="w-full px-3 py-2 border rounded-lg" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
                <textarea id="servicoDescricao" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tempo Estimado</label>
                <input type="text" id="servicoTempo" class="w-full px-3 py-2 border rounded-lg" placeholder="Ex: ~1h 30min">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                <select id="servicoCategoria" class="w-full px-3 py-2 border rounded-lg">
                  <option value="lavagem">Lavagem</option>
                  <option value="especial">Especial</option>
                  <option value="manutencao">Manutenção</option>
                  <option value="protecao">Proteção</option>
                  <option value="estetica">Estética</option>
                </select>
              </div>
              <div class="flex gap-2 pt-2">
                <button type="button" id="btnFecharModal" class="flex-1 px-4 py-2 border rounded-lg">Cancelar</button>
                <button type="submit" class="flex-1 bg-primary text-white px-4 py-2 rounded-lg">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { CATALOGO, sugerirCampanhas } from '../js/catalogo.js';

    const lista = document.getElementById('listaServicos');
    const modal = document.getElementById('modalServico');
    const form = document.getElementById('formServico');
    const sugestoesBox = document.getElementById('sugestoesIA');

    // Carregar sugestões
    function renderizarSugestoes() {
      const sugestoes = sugerirCampanhas();
      sugestoesBox.innerHTML = sugestoes.map(s => `
        <div class="bg-white p-3 rounded-lg border border-green-100">
          <p class="font-medium text-green-800 text-sm">${s.titulo}</p>
          <p class="text-xs text-slate-500 mt-1">${s.ideia}</p>
          <button class="usarIdeia mt-2 text-xs bg-green-50 text-green-700 px-2 py-1 rounded" data-ideia="${encodeURIComponent(JSON.stringify(s))}">
            Usar essa ideia →
          </button>
        </div>
      `).join('');
    }

    // Renderizar lista
    function renderizarLista() {
      lista.innerHTML = CATALOGO.servicos.map(s => `
        <div class="bg-white p-4 rounded-lg border border-slate-100 flex justify-between items-center">
          <div>
            <h4 class="font-semibold text-slate-800">${s.nome}</h4>
            <p class="text-sm text-slate-500 mt-1">${s.descricao}</p>
            <p class="text-xs text-slate-400 mt-1">${s.tempoEstimado} • ${s.categoria}</p>
          </div>
          <div class="text-right">
            <p class="font-bold text-primary">R$ ${s.valor.toFixed(2).replace('.', ',')}</p>
            <button class="editarServico mt-2 text-xs text-slate-500 hover:text-primary" data-id="${s.id}">
              <i class="fa fa-pen"></i> Editar
            </button>
          </div>
        </div>
      `).join('');

      // Vincular eventos
      document.querySelectorAll('.editarServico').forEach(btn => {
        btn.onclick = () => abrirModal(btn.dataset.id);
      });
      document.querySelectorAll('.usarIdeia').forEach(btn => {
        btn.onclick = () => {
          const ideia = JSON.parse(decodeURIComponent(btn.dataset.ideia));
          localStorage.setItem('cleancar_ideiaAtual', JSON.stringify(ideia));
          window.location.href = 'criar.html';
        };
      });
    }

    // Modal
    function abrirModal(id = null) {
      if (id) {
        const s = CATALOGO.servicos.find(x => x.id === id);
        document.getElementById('tituloModal').textContent = 'Editar Serviço';
        document.getElementById('servicoId').value = id;
        document.getElementById('servicoNome').value = s.nome;
        document.getElementById('servicoValor').value = s.valor;
        document.getElementById('servicoDescricao').value = s.descricao;
        document.getElementById('servicoTempo').value = s.tempoEstimado || '';
        document.getElementById('servicoCategoria').value = s.categoria;
      } else {
        document.getElementById('tituloModal').textContent = 'Novo Serviço';
        form.reset();
        document.getElementById('servicoId').value = '';
      }
      modal.classList.remove('hidden');
    }

    // Salvar
    form.onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('servicoId').value || 
        document.getElementById('servicoNome').value.toLowerCase().replace(/\s+/g, '-');
      
      const indice = CATALOGO.servicos.findIndex(s => s.id === id);
      const dados = {
        id,
        nome: document.getElementById('servicoNome').value,
        valor: parseFloat(document.getElementById('servicoValor').value),
        descricao: document.getElementById('servicoDescricao').value,
        tempoEstimado: document.getElementById('servicoTempo').value,
        categoria: document.getElementById('servicoCategoria').value
      };

      if (indice >= 0) CATALOGO.servicos[indice] = dados;
      else CATALOGO.servicos.push(dados);

      modal.classList.add('hidden');
      renderizarLista();
      // Salvar no localStorage para persistir
      localStorage.setItem('cleancar_catalogo', JSON.stringify(CATALOGO.servicos));
    };

    // Restaurar do localStorage se existir
    const salvo = localStorage.getItem('cleancar_catalogo');
    if (salvo) CATALOGO.servicos = JSON.parse(salvo);

    // Eventos
    document.getElementById('btnNovoServico').onclick = () => abrirModal();
    document.getElementById('btnFecharModal').onclick = () => modal.classList.add('hidden');

    // Inicializar
    renderizarSugestoes();
    renderizarLista();
  </script>
</body>
</html>
